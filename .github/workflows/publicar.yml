# Publica la carpeta web/ en GitHub Pages cada vez que se suben cambios a main.
# En GitHub: Settings → Pages → Source: "GitHub Actions" y Custom domain: lacolmena.site
name: Publicar La Colmena

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar los archivos del sitio
        # Copia web/ sin los documentos de trabajo (Markdown y PDF)
        run: |
          mkdir _site
          rsync -a --exclude='*.md' --exclude='*.pdf' web/ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: despliegue
        uses: actions/deploy-pages@v4
